[project]
name = "comfyui-tenstorrent"
description = "Requires Tenstorrent hardware (Linux). ComfyUI nodes that run SDXL, SD3.5, Wan 2.2, LTX-2.3 and MiniMax-H3 on Tenstorrent hardware through a bundled media server."
version = "0.3.1"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
]
# The board-reset packages ship Linux wheels only; elsewhere the nodes still
# load and fail with a clear error when used.
dependencies = [
    "requests",
    "tt-smi; sys_platform == 'linux'",
    "pyluwen~=0.8.0; sys_platform == 'linux'",
    "tt-umd==0.9.3; sys_platform == 'linux'",
    "tt_tools_common~=1.6.0; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/stisiTT/ComfyUI-Tenstorrent"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-Tenstorrent"
Icon = ""
